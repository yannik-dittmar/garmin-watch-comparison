# One service, one command:
#
#   docker compose up            # http://localhost:8080
#
# With the snapshot committed, the first run normally finds it on the ./data mount
# and serves in seconds. An empty mount makes it scrape garmin.com first (a few
# minutes, progress in the log).
#
#   docker compose up --build          pick up a code change
#   REFRESH=1 docker compose up        refetch the snapshot first

services:
  site:
    build: .
    image: garmin-watch-index
    ports:
      - '8080:80'
    # The snapshot is this container's only state. The normalized half is in git,
    # but data/raw/ is not — and that mount is what makes an interrupted or failed
    # first run resumable rather than a full refetch.
    volumes:
      - ./data:/app/data
    environment:
      REFRESH: ${REFRESH:-0}
    restart: unless-stopped
