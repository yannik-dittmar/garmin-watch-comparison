server {
    listen       80;
    server_name  _;
    # Served in place from the build output. The pipeline and the build both run
    # at container start, so there is nothing to copy anywhere.
    root         /app/dist;
    index        index.html;

    # This is a private tool, not a published site.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # catalog.json is ~1 MB of repetitive JSON that compresses to ~37 KB, so
    # this is the single biggest thing the server can do for load time.
    gzip              on;
    gzip_types        application/json text/css application/javascript image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_vary         on;

    # Hashed build assets and the self-hosted fonts never change under their name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Product imagery is stable for the life of a snapshot but is not hashed,
    # so it revalidates rather than being pinned for a year.
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The snapshot itself is replaced by a refresh; always revalidate it, or a
    # stale catalog would silently outlive its own snapshot date.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Routing is hash-based, so there are no server-side routes to rewrite —
    # only the single entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
