<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Fonts come from jsDelivr (src/styles/fonts.css). The stylesheet that names them
         is itself a hashed bundle asset, so the browser only learns about this origin
         mid-parse; warming the connection here saves a DNS+TLS round trip on first paint. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <title>Garmin Smartwatch Vergleich</title>
    <script>
      // Applied before first paint so the chosen theme never flashes the other palette.
      (function () {
        try {
          var t = localStorage.getItem('gwc:theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
