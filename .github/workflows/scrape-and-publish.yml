# Refresh the snapshot and republish the site.
#
# Two jobs rather than one, because the whole point of the split is that the
# scrape's `runs-on` can move to a self-hosted runner in a single line if Garmin's
# Cloudflare bot management rejects GitHub's datacenter ranges (design D2). They
# hand off through an artifact rather than a second checkout, so `publish` builds
# exactly what `scrape` produced instead of racing the push (design D3).
#
# Failure is safe by construction: the regression guard in `npm run normalize`
# exits non-zero rather than overwriting a good snapshot with a worse one, so a
# blocked or broken scrape fails the run and visitors keep the last good deploy.

name: Scrape and publish

on:
  # Enabled once the workflow has been exercised through workflow_dispatch and
  # Pages is confirmed working (task 8.8 / 10.6). 04:17 UTC is off-peak and
  # deliberately not on the hour, where every cron on GitHub queues at once.
  # schedule:
  #   - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Publish from the committed snapshot without scraping garmin.com'
        type: boolean
        default: false
  push:
    branches: [main]
    # Site code only. A CSS change republishes from the committed snapshot; it
    # must never be a reason to scrape garmin.com (task 8.5).
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/scrape-and-publish.yml'

# One publication at a time. In-progress deploys are allowed to finish rather
# than being cancelled, so a half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and normalize
    # ── The swappable line (design D2). Change to `self-hosted` if Cloudflare
    #    rejects GitHub's IP ranges; nothing else in this file changes.
    runs-on: ubuntu-latest
    # Skipped on a code-only push, which republishes from the snapshot already in
    # git and contacts nobody — and skippable by hand, which is how you get a
    # deploy out while the scrape is broken or being debugged. `inputs` is null on
    # a schedule, so the daily run always scrapes.
    if: github.event_name != 'push' && inputs.skip_scrape != true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --no-cache is not belt-and-braces on a fresh runner, it is the intent
      # made explicit: the on-disk response cache has no TTL, so a refresh that
      # read it could never observe a price change (design D8). Stated here so an
      # actions/cache step can never silently reintroduce one.
      - name: Ingest
        run: npm run ingest -- --no-cache

      # Exits non-zero when the regression guard trips, which is what stops a
      # worse snapshot from being committed or published (design D4).
      - name: Normalize
        run: npm run normalize

      # Garmin adding hotlink protection would break every image at once, and the
      # browser-side placeholder would quietly render it as "no imagery". Assert
      # one real URL from the snapshot just written, with a foreign referer.
      - name: Check imagery is still hotlinkable
        run: |
          url=$(node -p "require('./data/catalog.json').models.map(m=>m.image).find(Boolean) || ''")
          if [ -z "$url" ]; then
            echo "::error::snapshot contains no image URL to check"
            exit 1
          fi
          echo "checking $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Referer: https://github.io/' \
            -H 'Accept: image/webp,image/*' "$url")
          if [ "$code" != "200" ]; then
            echo "::error::hotlink check failed: HTTP $code for $url — Garmin may have added referer checking"
            exit 1
          fi
          echo "hotlink check passed (HTTP 200)"

      # Every run commits: per-model `fetchedAt` changes even when no watch does,
      # so this is also what accumulates the price history in git (design D4).
      - name: Commit the snapshot
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/meta.json data/models
          if git diff --staged --quiet; then
            echo "no snapshot change to commit"
          else
            git commit -m "data: refresh snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            data/catalog.json
            data/meta.json
            data/models
          retention-days: 14

  publish:
    name: Build and deploy to Pages
    runs-on: ubuntu-latest
    needs: scrape
    # Runs after a successful scrape, and also on a code-only push where `scrape`
    # was skipped — but never after a scrape that failed, which is the case that
    # must leave the live site untouched.
    if: always() && needs.scrape.result != 'failure' && needs.scrape.result != 'cancelled'
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The snapshot this run produced, rather than whatever the checkout above
      # happened to catch — the push from `scrape` may not have propagated yet
      # (design D3). On a code-only push there is no artifact and the committed
      # snapshot from the checkout is the input.
      - name: Download the snapshot
        if: needs.scrape.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: data

      # A project page is served from /<repo>/, so the base path is a build-time
      # argument rather than a constant in vite.config.ts — the Docker build still
      # wants '/' (design D5). Going through `npm run build` rather than calling
      # vite directly keeps the typecheck in front of the deploy.
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
